<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>OLTREVISTA</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .logo {
            width: 90px;
            margin-bottom: 1.5rem;
            opacity: 0.95;
        }

            font-size: 3rem;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        p.tagline {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 2rem;
        }

        .links a {
            color: #fff;
            text-decoration: none;
            margin: 0 12px;
            font-size: 1rem;
            opacity: 0.8;
            transition: opacity 0.2s ease;
        }

        .links a:hover {
            opacity: 1;
        }

        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            opacity: 0.5;
        }
    </style>

<body>

    <!-- Logo -->
    <img src="logo.png" alt="OLTREVISTA Logo" class="logo">

    <!-- Brand -->
    <h1>OLTREVISTA</h1>

    <!-- Social Links -->

        <a href="https://youtube.com/@oltrevista" target="_blank">YouTube</a>
